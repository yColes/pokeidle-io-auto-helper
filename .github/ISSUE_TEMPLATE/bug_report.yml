name: Bug report
description: Informe um problema reproduzível na extensão
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Versão da extensão
      placeholder: "1.4.0"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Navegador
      placeholder: "Opera GX / Chrome / Edge + versão"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: O que aconteceu?
      description: Descreva o problema e os passos para reproduzir.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: O que você esperava?
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Informações adicionais
      description: Screenshots, mensagens do console ou outros detalhes úteis.
